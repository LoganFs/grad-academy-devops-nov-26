# Nginx load balancer: round-robins across the two Social Hub app containers.
upstream social_hub {
    server app1:80;
    server app2:80;
}

server {
    listen 80;

    location / {
        proxy_pass http://social_hub;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
